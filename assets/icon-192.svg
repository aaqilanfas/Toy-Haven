<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf4" />
      <stop offset="100%" stop-color="#ffece6" />
    </linearGradient>
    <linearGradient id="head192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b57" />
      <stop offset="100%" stop-color="#df4f3e" />
    </linearGradient>
    <linearGradient id="star192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ffc857" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg192)" stroke="#ffd7cf" stroke-width="2"/>

  <!-- Antenna -->
  <rect x="88" y="24" width="16" height="28" rx="8" fill="#ffc857" />
  <circle cx="96" cy="24" r="14" fill="url(#star192)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>

  <!-- Robot Head Box -->
  <rect x="28" y="48" width="136" height="116" rx="36" fill="url(#head192)" filter="drop-shadow(0 8px 16px rgba(22, 50, 79, 0.18))"/>

  <!-- Eyes Outer -->
  <ellipse cx="68" cy="98" rx="16" ry="18" fill="#ffffff"/>
  <circle cx="70" cy="98" r="9" fill="#16324f"/>
  <circle cx="74" cy="94" r="4" fill="#ffffff"/>

  <ellipse cx="124" cy="98" rx="16" ry="18" fill="#ffffff"/>
  <circle cx="126" cy="98" r="9" fill="#16324f"/>
  <circle cx="130" cy="94" r="4" fill="#ffffff"/>

  <!-- Cheeks -->
  <circle cx="48" cy="116" r="8" fill="#ffc857" opacity="0.9"/>
  <circle cx="144" cy="116" r="8" fill="#ffc857" opacity="0.9"/>

  <!-- Smile -->
  <path d="M72 130c8 14 40 14 48 0" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>