<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMustang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="40%" stop-color="#9a3412"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgMustang)"/>
  <!-- Sunset Sun -->
  <circle cx="300" cy="180" r="100" fill="#fef08a" opacity="0.4"/>
  <!-- Road Surface & Shadow -->
  <rect x="0" y="370" width="600" height="130" fill="#1e293b"/>
  <line x1="0" y1="440" x2="600" y2="440" stroke="#facc15" stroke-width="6" stroke-dasharray="35,25"/>
  <ellipse cx="300" cy="385" rx="250" ry="25" fill="#020617" opacity="0.7"/>
  <!-- 1967 Classic Muscle Car Profile -->
  <g transform="translate(60, 200)">
    <!-- Cabin & Windows -->
    <path d="M120 70 L180 15 L320 15 L380 70 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M190 25 L310 25 L360 65 L150 65 Z" fill="#38bdf8" opacity="0.7"/>
    <!-- Car Body -->
    <path d="M20 100 C15 75 70 70 120 70 L390 70 C440 70 480 85 470 115 L450 145 C390 145 370 110 330 110 C290 110 270 145 200 145 C150 145 130 110 90 110 C50 110 30 145 15 145 Z" fill="url(#carBody)" stroke="#f87171" stroke-width="2"/>
    <!-- Chrome Trim & Bumpers -->
    <rect x="460" y="115" width="20" height="15" rx="4" fill="#e2e8f0"/>
    <rect x="10" y="115" width="18" height="15" rx="4" fill="#e2e8f0"/>
    <!-- Racing Stripes -->
    <line x1="120" y1="70" x2="380" y2="70" stroke="#ffffff" stroke-width="4"/>
    <!-- Door Handle -->
    <rect x="220" y="85" width="20" height="5" rx="2" fill="#f8fafc"/>
    <!-- Headlight & Taillight -->
    <circle cx="465" cy="98" r="8" fill="#fef08a" filter="drop-shadow(2px 0 6px #fef08a)"/>
    <rect x="14" y="90" width="6" height="16" rx="2" fill="#ef4444"/>
    <!-- Front Wheel (Right in profile) -->
    <g transform="translate(345, 140)">
      <circle cx="0" cy="0" r="38" fill="#0f172a"/>
      <circle cx="0" cy="0" r="26" fill="#64748b" stroke="#cbd5e1" stroke-width="4"/>
      <!-- Alloy Spokes -->
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#f8fafc" stroke-width="4"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#f8fafc" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="#dc2626"/>
    </g>
    <!-- Rear Wheel -->
    <g transform="translate(105, 140)">
      <circle cx="0" cy="0" r="38" fill="#0f172a"/>
      <circle cx="0" cy="0" r="26" fill="#64748b" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#f8fafc" stroke-width="4"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#f8fafc" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="#dc2626"/>
    </g>
  </g>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#fde047" opacity="0.8">DIECAST CARS Â· 1967 SUNSET MUSTANG</text>
</svg>
