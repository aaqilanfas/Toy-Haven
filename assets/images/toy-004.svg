<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgMars)"/>
  <!-- Martian Terrain -->
  <ellipse cx="300" cy="450" rx="280" ry="60" fill="#431407"/>
  <!-- Solar Rover Chassis -->
  <rect x="180" y="210" width="220" height="90" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="4"/>
  <!-- Solar Panel on Top -->
  <rect x="140" y="160" width="290" height="42" rx="8" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
  <line x1="190" y1="160" x2="190" y2="202" stroke="#60a5fa" stroke-width="2"/>
  <line x1="240" y1="160" x2="240" y2="202" stroke="#60a5fa" stroke-width="2"/>
  <line x1="290" y1="160" x2="290" y2="202" stroke="#60a5fa" stroke-width="2"/>
  <line x1="340" y1="160" x2="340" y2="202" stroke="#60a5fa" stroke-width="2"/>
  <line x1="390" y1="160" x2="390" y2="202" stroke="#60a5fa" stroke-width="2"/>
  <!-- Mast Camera -->
  <rect x="340" y="90" width="12" height="70" rx="4" fill="#64748b"/>
  <rect x="325" y="70" width="42" height="24" rx="6" fill="#0f172a"/>
  <circle cx="338" cy="82" r="7" fill="#38bdf8"/>
  <circle cx="354" cy="82" r="7" fill="#38bdf8"/>
  <!-- Rocker-Bogie Suspension Arms -->
  <path d="M220 290 L160 370 M290 290 L290 370 M360 290 L420 370" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <!-- 6 Big Rover Wheels -->
  <circle cx="160" cy="370" r="28" fill="#1e293b" stroke="#64748b" stroke-width="5"/>
  <circle cx="290" cy="370" r="28" fill="#1e293b" stroke="#64748b" stroke-width="5"/>
  <circle cx="420" cy="370" r="28" fill="#1e293b" stroke="#64748b" stroke-width="5"/>
  <circle cx="160" cy="370" r="8" fill="#f8fafc"/>
  <circle cx="290" cy="370" r="8" fill="#f8fafc"/>
  <circle cx="420" cy="370" r="8" fill="#f8fafc"/>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#fed7aa" opacity="0.8">TOYS Â· SOLAR MARS ROVER</text>
