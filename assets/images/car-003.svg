<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRally" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgRally)"/>
  <!-- Mountain Trails & Mud -->
  <polygon points="0,380 600,340 600,500 0,500" fill="#451a03"/>
  <ellipse cx="300" cy="405" rx="230" ry="24" fill="#1c1917" opacity="0.6"/>
  <!-- Off-Road Dakar 4x4 Truck -->
  <g transform="translate(60, 170)">
    <!-- Roof Rack & Spare Tire -->
    <rect x="150" y="10" width="180" height="12" rx="4" fill="#0f172a"/>
    <ellipse cx="230" cy="6" rx="35" ry="10" fill="#334155"/>
    <circle cx="160" cy="16" r="6" fill="#fef08a"/>
    <circle cx="185" cy="16" r="6" fill="#fef08a"/>
    <!-- High Cab & Windows -->
    <rect x="130" y="22" width="210" height="75" rx="14" fill="#facc15" stroke="#713f12" stroke-width="4"/>
    <rect x="150" y="32" width="70" height="40" rx="6" fill="#0f172a"/>
    <rect x="235" y="32" width="90" height="40" rx="6" fill="#0f172a"/>
    <!-- Rugged Body -->
    <path d="M40 95 L440 95 L425 150 C380 150 360 115 320 115 C280 115 260 150 200 150 C160 150 140 115 100 115 C60 115 40 150 30 150 Z" fill="#eab308" stroke="#a16207" stroke-width="4"/>
    <!-- Mud Splash / Decal -->
    <path d="M210 105 L260 105 L245 135 L195 135 Z" fill="#713f12"/>
    <text x="212" y="128" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#ffffff">47</text>
    <!-- Heavy Duty Deep Tread Tires -->
    <g transform="translate(340, 150)">
      <circle cx="0" cy="0" r="44" fill="#1c1917"/>
      <circle cx="0" cy="0" r="28" fill="#475569" stroke="#cbd5e1" stroke-width="6"/>
      <circle cx="0" cy="0" r="10" fill="#eab308"/>
    </g>
    <g transform="translate(100, 150)">
      <circle cx="0" cy="0" r="44" fill="#1c1917"/>
      <circle cx="0" cy="0" r="28" fill="#475569" stroke="#cbd5e1" stroke-width="6"/>
      <circle cx="0" cy="0" r="10" fill="#eab308"/>
    </g>
  </g>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#fef08a" opacity="0.8">DIECAST CARS Â· RALLY TRAILBLAZER</text>
</svg>
