<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRobot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgRobot)"/>
  <!-- Shadow Base -->
  <ellipse cx="300" cy="440" rx="200" ry="35" fill="#9a3412" opacity="0.5"/>
  <!-- Antenna -->
  <rect x="294" y="60" width="12" height="45" rx="6" fill="#475569"/>
  <circle cx="300" cy="55" r="16" fill="#ef4444"/>
  <circle cx="295" cy="50" r="5" fill="#ffffff"/>
  <!-- Ears / Bolts -->
  <rect x="210" y="140" width="20" height="36" rx="8" fill="#0284c7"/>
  <rect x="370" y="140" width="20" height="36" rx="8" fill="#0284c7"/>
  <!-- Robot Head -->
  <rect x="225" y="100" width="150" height="115" rx="28" fill="url(#metal)" stroke="#475569" stroke-width="4"/>
  <!-- Eye Screen -->
  <rect x="245" y="125" width="110" height="42" rx="14" fill="#0f172a"/>
  <circle cx="275" cy="146" r="13" fill="#38bdf8"/>
  <circle cx="325" cy="146" r="13" fill="#38bdf8"/>
  <circle cx="277" cy="144" r="5" fill="#ffffff"/>
  <circle cx="327" cy="144" r="5" fill="#ffffff"/>
  <!-- Mouth Grill -->
  <rect x="260" y="180" width="80" height="16" rx="6" fill="#e2e8f0"/>
  <line x1="275" y1="180" x2="275" y2="196" stroke="#64748b" stroke-width="3"/>
  <line x1="290" y1="180" x2="290" y2="196" stroke="#64748b" stroke-width="3"/>
  <line x1="305" y1="180" x2="305" y2="196" stroke="#64748b" stroke-width="3"/>
  <line x1="320" y1="180" x2="320" y2="196" stroke="#64748b" stroke-width="3"/>
  <!-- Neck -->
  <rect x="280" y="215" width="40" height="18" rx="6" fill="#64748b"/>
  <!-- Torso -->
  <rect x="215" y="233" width="170" height="145" rx="30" fill="url(#metal)" stroke="#475569" stroke-width="4"/>
  <!-- Gauge & Controls on Chest -->
  <circle cx="260" cy="285" r="24" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <path d="M260 285 L272 273" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <rect x="305" y="265" width="55" height="12" rx="4" fill="#22c55e"/>
  <rect x="305" y="285" width="55" height="12" rx="4" fill="#eab308"/>
  <rect x="305" y="305" width="55" height="12" rx="4" fill="#3b82f6"/>
  <!-- Arms with Claws -->
  <rect x="170" y="250" width="45" height="85" rx="16" fill="url(#metal)" transform="rotate(15 170 250)"/>
  <circle cx="150" cy="350" r="16" fill="#0284c7"/>
  <rect x="385" y="250" width="45" height="85" rx="16" fill="url(#metal)" transform="rotate(-15 385 250)"/>
  <circle cx="450" cy="350" r="16" fill="#0284c7"/>
  <!-- Legs -->
  <rect x="245" y="378" width="45" height="55" rx="16" fill="#64748b"/>
  <rect x="310" y="378" width="45" height="55" rx="16" fill="#64748b"/>
  <rect x="235" y="420" width="60" height="24" rx="10" fill="#0284c7"/>
  <rect x="305" y="420" width="60" height="24" rx="10" fill="#0284c7"/>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff" opacity="0.8">FIGURINES Â· RETRO ROBOT BUDDY</text>
</svg>
