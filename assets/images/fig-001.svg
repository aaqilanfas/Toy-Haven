<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgCosmic)"/>
  <circle cx="300" cy="220" r="180" fill="url(#glow)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="90" cy="70" r="2.5"/><circle cx="150" cy="120" r="1.5"/><circle cx="210" cy="60" r="2"/>
    <circle cx="490" cy="90" r="2.5"/><circle cx="530" cy="160" r="1.5"/><circle cx="440" cy="70" r="3"/>
    <circle cx="100" cy="280" r="2"/><circle cx="510" cy="310" r="2.5"/><circle cx="80" cy="400" r="1.5"/>
  </g>
  <!-- Moon Surface Base -->
  <ellipse cx="300" cy="450" rx="260" ry="60" fill="#334155"/>
  <ellipse cx="220" cy="440" rx="30" ry="10" fill="#1e293b"/>
  <ellipse cx="380" cy="460" rx="45" ry="12" fill="#1e293b"/>
  <ellipse cx="290" cy="425" rx="16" ry="6" fill="#1e293b"/>
  <!-- Astronaut Figurine -->
  <!-- Backpack / Jetpack -->
  <rect x="235" y="145" width="130" height="150" rx="24" fill="#94a3b8"/>
  <rect x="250" y="130" width="100" height="24" rx="8" fill="#64748b"/>
  <circle cx="340" cy="140" r="6" fill="#ef4444"/>
  <!-- Body Suit -->
  <rect x="245" y="190" width="110" height="130" rx="30" fill="url(#suit)"/>
  <!-- Chest Controller -->
  <rect x="270" y="220" width="60" height="42" rx="10" fill="#0284c7"/>
  <circle cx="288" cy="241" r="6" fill="#22c55e"/>
  <circle cx="312" cy="241" r="6" fill="#eab308"/>
  <!-- Arms & Gloves -->
  <rect x="200" y="195" width="45" height="90" rx="20" fill="url(#suit)" transform="rotate(18 200 195)"/>
  <circle cx="185" cy="290" r="18" fill="#ff6b57"/>
  <rect x="355" y="195" width="45" height="90" rx="20" fill="url(#suit)" transform="rotate(-18 355 195)"/>
  <circle cx="415" cy="290" r="18" fill="#ff6b57"/>
  <!-- Legs & Boots -->
  <rect x="250" y="310" width="42" height="95" rx="18" fill="url(#suit)"/>
  <rect x="242" y="385" width="55" height="28" rx="12" fill="#475569"/>
  <rect x="308" y="310" width="42" height="95" rx="18" fill="url(#suit)"/>
  <rect x="303" y="385" width="55" height="28" rx="12" fill="#475569"/>
  <!-- Helmet & Visor -->
  <circle cx="300" cy="135" r="58" fill="url(#suit)"/>
  <rect x="252" y="98" width="96" height="74" rx="34" fill="url(#visor)" stroke="#e2e8f0" stroke-width="4"/>
  <ellipse cx="280" cy="120" rx="22" ry="12" fill="#ffffff" opacity="0.6" transform="rotate(-15 280 120)"/>
  <!-- Mini Rover Companion -->
  <g transform="translate(110, 360)">
    <rect x="10" y="20" width="65" height="35" rx="10" fill="#ff6b57"/>
    <circle cx="22" cy="58" r="14" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="62" cy="58" r="14" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
    <rect x="38" y="5" width="8" height="16" rx="3" fill="#cbd5e1"/>
    <circle cx="42" cy="5" r="7" fill="#38bdf8"/>
  </g>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#94a3b8" opacity="0.7">FIGURINES Â· COSMIC EXPLORER</text>
</svg>
