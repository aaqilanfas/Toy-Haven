<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGarden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgGarden)"/>
  <!-- Game Board Frame -->
  <rect x="80" y="80" width="440" height="320" rx="24" fill="#fef3c7" stroke="#78350f" stroke-width="8"/>
  <!-- Garden Flower Tiles -->
  <g transform="translate(115, 110)">
    <!-- Tile 1 (Tulips) -->
    <rect x="0" y="0" width="115" height="115" rx="14" fill="#fbcfe8" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="57" cy="50" r="22" fill="#e11d48"/>
    <path d="M57 72 L57 100" stroke="#16a34a" stroke-width="5"/>
    <!-- Tile 2 (Sunflowers) -->
    <rect x="130" y="0" width="115" height="115" rx="14" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="187" cy="55" r="24" fill="#eab308"/>
    <circle cx="187" cy="55" r="12" fill="#78350f"/>
    <!-- Tile 3 (Lavender) -->
    <rect x="260" y="0" width="115" height="115" rx="14" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <rect x="312" y="25" width="12" height="60" rx="6" fill="#7e22ce"/>
    <!-- Tile 4 (Pond & Lilies) -->
    <rect x="0" y="130" width="115" height="115" rx="14" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <circle cx="57" cy="187" r="28" fill="#38bdf8"/>
    <circle cx="57" cy="187" r="10" fill="#ec4899"/>
    <!-- Tile 5 (Honeybee Hive) -->
    <rect x="130" y="130" width="115" height="115" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <ellipse cx="187" cy="187" rx="24" ry="18" fill="#f59e0b"/>
    <line x1="178" y1="172" x2="178" y2="202" stroke="#451a03" stroke-width="4"/>
    <line x1="196" y1="172" x2="196" y2="202" stroke="#451a03" stroke-width="4"/>
    <!-- Tile 6 (Gazebo) -->
    <rect x="260" y="130" width="115" height="115" rx="14" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
    <polygon points="317,145 285,180 350,180" fill="#dc2626"/>
  </g>
  <!-- Wooden Meeples -->
  <g transform="translate(60, 310)">
    <circle cx="20" cy="15" r="14" fill="#3b82f6"/>
    <path d="M5 50 C5 30 35 30 35 50 Z" fill="#3b82f6"/>
  </g>
  <g transform="translate(500, 290)">
    <circle cx="20" cy="15" r="14" fill="#ec4899"/>
    <path d="M5 50 C5 30 35 30 35 50 Z" fill="#ec4899"/>
  </g>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff" opacity="0.8">BOARD GAMES Â· GARDEN PARTY</text>
</svg>
