<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlocks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="20" fill="url(#bgBlocks)"/>
  <!-- Floor Shadow -->
  <ellipse cx="300" cy="430" rx="240" ry="40" fill="#92400e" opacity="0.15"/>
  <!-- Wooden Block City Creation -->
  <!-- Base Blocks -->
  <g transform="translate(140, 280)">
    <!-- Red Block Left -->
    <rect x="0" y="50" width="90" height="75" rx="8" fill="#ef4444"/>
    <polygon points="0,50 25,25 115,25 90,50" fill="#f87171"/>
    <polygon points="90,50 115,25 115,100 90,125" fill="#dc2626"/>
    <!-- Yellow Block Center -->
    <rect x="110" y="50" width="100" height="75" rx="8" fill="#eab308"/>
    <polygon points="110,50 135,25 235,25 210,50" fill="#facc15"/>
    <polygon points="210,50 235,25 235,100 210,125" fill="#ca8a04"/>
    <!-- Blue Block Right -->
    <rect x="230" y="50" width="90" height="75" rx="8" fill="#3b82f6"/>
    <polygon points="230,50 255,25 345,25 320,50" fill="#60a5fa"/>
    <polygon points="320,50 345,25 345,100 320,125" fill="#2563eb"/>
  </g>
  <!-- Middle Level Blocks -->
  <g transform="translate(190, 180)">
    <!-- Green Arch Bridge -->
    <path d="M0 60 L140 60 L140 10 L0 10 Z" fill="#10b981"/>
    <polygon points="0,10 25,-10 165,-10 140,10" fill="#34d399"/>
    <polygon points="140,10 165,-10 165,40 140,60" fill="#059669"/>
    <!-- Arch Cutout -->
    <circle cx="70" cy="60" r="30" fill="url(#bgBlocks)"/>
    <!-- Orange Block Right -->
    <rect x="160" y="0" width="60" height="70" rx="6" fill="#f97316"/>
  </g>
  <!-- Top Towers & Cones -->
  <g transform="translate(225, 60)">
    <!-- Purple Pillar -->
    <rect x="0" y="40" width="50" height="75" rx="6" fill="#a855f7"/>
    <polygon points="0,40 15,20 65,20 50,40" fill="#c084fc"/>
    <!-- Triangle Rooftop Left -->
    <polygon points="25,-10 0,35 50,35" fill="#ef4444"/>
    <!-- Cyan Cylinder / Cone Right -->
    <rect x="75" y="40" width="50" height="75" rx="6" fill="#06b6d4"/>
    <polygon points="100,-10 75,35 125,35" fill="#eab308"/>
  </g>
  <!-- Scattered Small Cylinders & Spheres -->
  <circle cx="100" cy="400" r="26" fill="#ec4899"/>
  <ellipse cx="480" cy="380" rx="30" ry="18" fill="#8b5cf6"/>
  <rect x="470" y="340" width="40" height="40" rx="8" fill="#10b981"/>
  <text x="30" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#78350f" opacity="0.8">TOYS Â· BUILD-IT CITY BLOCKS</text>
</svg>
