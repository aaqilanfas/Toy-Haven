<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b57" />
      <stop offset="100%" stop-color="#ff8e72" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ffc857" />
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <rect x="29" y="4" width="6" height="10" rx="3" fill="#ffc857" />
  <circle cx="32" cy="5" r="5" fill="url(#starGrad)" />

  <!-- Robot Head Box -->
  <rect x="6" y="12" width="52" height="48" rx="16" fill="url(#favBg)" filter="drop-shadow(0 4px 6px rgba(22, 50, 79, 0.2))"/>

  <!-- Eyes Outer -->
  <ellipse cx="23" cy="33" rx="6" ry="7" fill="#ffffff"/>
  <circle cx="24" cy="33" r="3.5" fill="#16324f"/>
  <circle cx="26" cy="31" r="1.5" fill="#ffffff"/>

  <ellipse cx="41" cy="33" rx="6" ry="7" fill="#ffffff"/>
  <circle cx="42" cy="33" r="3.5" fill="#16324f"/>
  <circle cx="44" cy="31" r="1.5" fill="#ffffff"/>

  <!-- Cheeks -->
  <circle cx="16" cy="39" r="3" fill="#ffc857" opacity="0.9"/>
  <circle cx="48" cy="39" r="3" fill="#ffc857" opacity="0.9"/>

  <!-- Smile -->
  <path d="M23 44c4 6 14 6 18 0" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>